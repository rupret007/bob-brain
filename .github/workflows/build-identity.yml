name: Build identity

on:
  pull_request:
    paths:
      - webchat/build_info.py
      - webchat/test_build_info*.py
      - .github/workflows/build-identity.yml
  push:
    branches:
      - draft/webbob-go-live-20261018
    paths:
      - webchat/build_info.py
      - webchat/test_build_info*.py
      - .github/workflows/build-identity.yml

concurrency:
  group: build-identity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-identity:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test build identity with real Git and global-config regressions
        env:
          PYTHONPATH: ${{ github.workspace }}/webchat:${{ github.workspace }}/services:${{ github.workspace }}/state:${{ github.workspace }}
          PYTHONDONTWRITEBYTECODE: '1'
          BOB_WEBCHAT_DISPATCH: '0'
          BOB_WEBCHAT_DRILLS: '0'
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_NOSYSTEM: '1'
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.hooksPath
          GIT_CONFIG_VALUE_0: /dev/null
        run: python -m unittest discover -s webchat -p 'test_build_info*.py' -v
