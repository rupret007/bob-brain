# Lane routing v5 (Jeff 2026-10-16 17:21 CT, Codex reset to 100%). Sourced by fill.sh.
# Per-job override: q-<job>.lane with lines "tier=high|cheap" and "provider=codex|cursor|gemini|minimax|claude". Default tier=cheap.
# Target concurrent lanes (steady state). Workhorses saturate; side lanes sized to plans.
TGT_codex=2      # v6.6 Jeff 22:45 CT 10/16: max 2; Codex cheap=low; high/xhigh only for security/hard logic/Karen-fail security
TGT_cursor=5      # v6.6: lean on Cursor for code/routine/docs/test-only/Karen-fail non-security (composer-2.5 until 10/21); nuc_ok caps 4–5
TGT_gemini=8     # v6.6: Gemini REVIEWS ONLY (pre-review + review). No new gemini-code/patch while GEMINI_PATCHES=0. gemini.pause still stops all
TGT_claude=1     # v5.2 Mini /opt/homebrew/bin/claude -p, max 1, needs mini_ok;: hard reviews + some HIGH fixes; skipped while a Karen screen runs (reserve)
TGT_minimax=1    # Mini, API only (bin/ask-minimax.sh): critiques, honesty passes, small-fix proposals
MINIMAX_DAILY_CALLS=80   # lane-side daily ceiling; existing script-tracked hard cap ($48 STATUS / $59 balance) still enforced by compat.py
# Models
CODEX_HIGH_EFFORT=high          # xhigh for security/auth: tier=xhigh
CODEX_CHEAP_EFFORT=low             # v6.6: default Codex effort low; high/xhigh reserved for security/hard logic
CURSOR_MODEL=composer-2.5
GEMINI_MODEL=gemini-3.1-pro-preview
GEMINI_CODE_MODEL=gemini-3.1-pro-preview   # coding/patch + full reviews
GEMINI_LIGHT_MODEL=gemini-3.8-flash        # cheap critique (mode light)
GEMINI_TOTAL_CAP=118     # Jeff 21:47 CT: use full prepaid ($121.48); gemini-direct.py writes gemini.pause at ~$118 est. or billing/credit/quota error or 429 storm
GEMINI_HOURLY_PACE=20    # fill holds new Gemini starts while last-60-min est. spend > this, so work flows all night (~10h)
DEFAULT_CHEAP_PROVIDER=cursor              # v6.6: cheap/routine/code -> Cursor composer-2.5; Gemini reviews only
GEMINI_DENY_RE='protocol-?2|protocol_v?2'  # Web Bob protocol-2 under Karen gate @1d3727f: never touch
CLAUDE_MODEL=claude-sonnet-5-thinking-high
# Codex weekly pacing: target ~90% used at reset. If used% > elapsed%*0.9 + 5, Codex takes HIGH tier only.
