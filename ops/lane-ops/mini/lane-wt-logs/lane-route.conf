# Lane routing v5 (Jeff 2026-10-16 17:21 CT, Codex reset to 100%). Sourced by fill.sh.
# Per-job override: q-<job>.lane with lines "tier=high|cheap" and "provider=codex|cursor|gemini|minimax|claude". Default tier=cheap.
# Target concurrent lanes (steady state). Workhorses saturate; side lanes sized to plans.
TGT_codex=3      # Mini app; 3 (2 if 15-min load >10); each start also needs mini_ok (load<=10, swap<80%, disk>=15G)
TGT_cursor=5      # NucBox composer-2.5 (grok 10/16 18:44: 3->4; NucBox 14 cores idle at load<3; nuc_ok still caps 4, 5 when load<10, load<12)
TGT_gemini=8     # v6 21:55 CT 10/16 Jeff: Gemini is the DEFAULT routine lane (prepaid $121, max push). API on Mini, tests on NucBox. gemini_ok scales down on Mini load>=10/swap>=80; gemini.pause stops all
TGT_claude=1     # v5.2 Mini /opt/homebrew/bin/claude -p, max 1, needs mini_ok;: hard reviews + some HIGH fixes; skipped while a Karen screen runs (reserve)
TGT_minimax=1    # Mini, API only (bin/ask-minimax.sh): critiques, honesty passes, small-fix proposals
MINIMAX_DAILY_CALLS=80   # lane-side daily ceiling; existing script-tracked hard cap ($48 STATUS / $59 balance) still enforced by compat.py
# Models
CODEX_HIGH_EFFORT=high          # xhigh for security/auth: tier=xhigh
CODEX_CHEAP_EFFORT=medium
CURSOR_MODEL=composer-2.5
GEMINI_MODEL=gemini-3.1-pro-preview
GEMINI_CODE_MODEL=gemini-3.1-pro-preview   # coding/patch + full reviews
GEMINI_LIGHT_MODEL=gemini-3.8-flash        # cheap critique (mode light)
GEMINI_TOTAL_CAP=118     # Jeff 21:47 CT: use full prepaid ($121.48); gemini-direct.py writes gemini.pause at ~$118 est. or billing/credit/quota error or 429 storm
GEMINI_HOURLY_PACE=20    # fill holds new Gemini starts while last-60-min est. spend > this, so work flows all night (~10h)
DEFAULT_CHEAP_PROVIDER=gemini              # v6: cheap/unspecified jobs -> gemini first; cursor stays for provider=cursor + fallback
GEMINI_DENY_RE='protocol-?2|protocol_v?2'  # Web Bob protocol-2 under Karen gate @1d3727f: never touch
CLAUDE_MODEL=claude-sonnet-5-thinking-high
# Codex weekly pacing: target ~90% used at reset. If used% > elapsed%*0.9 + 5, Codex takes HIGH tier only.
CODEX_TARGET_PCT=90
CODEX_MANUAL_RESET_TS=1792189312   # Jeff reset Codex 17:21 CT 10/16; capacity rows observed before this count as 0% used, week = 7d from here
# v5.3 (17:58 CT 10/16): Cursor Ultra usage limit hit until 10/21 for gpt-5.3-codex-high, gemini-3.1-pro, claude-sonnet-5-thinking-high (probed 17:56 CT; composer-2.5 OK).
# Until 10/21: high/xhigh tiers -> Codex (Mini, mini_ok); if Codex refused -> Cursor composer-2.5 on NucBox immediately. Never route those models through Cursor.
CODEX_REFUSED_FALLBACK=cursor
CURSOR_BLOCKED_MODELS="gpt-5.3-codex-high gemini-3.1-pro claude-sonnet-5-thinking-high"

# v6.2 (Jeff 21:59 CT): code/Karen-fail fixes + logic/security pre-reviews = pro thinkingLevel=high (max); routine reviews/PR bodies = pro high; flash only trivial critique/triage at medium
export GEMINI_REVIEW_THINK=high GEMINI_LIGHT_THINK=medium
