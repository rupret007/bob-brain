<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Bob">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="/manifest.webmanifest">
  <title>Bob · Chat</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <div class="app">
    <header class="top-bar">
      <div class="identity">
        <span class="status-dot" id="status-dot" aria-hidden="true"></span>
        <span class="avatar" aria-hidden="true">b</span>
        <div class="titles">
          <h1>Bob</h1>
          <p id="connection">Connected</p>
        </div>
      </div>
      <div class="top-actions">
        <button type="button" id="open-sheet" class="icon-btn" aria-expanded="false" aria-controls="tools-sheet" aria-label="Ops and settings">⋯</button>
        <button type="button" id="logout" class="quiet">Log out</button>
      </div>
    </header>
    <button type="button" id="handback-chip" class="handback-chip" hidden aria-label="Handback summary"></button>
    <div class="conversation-bar">
      <label class="sr-only" for="conversations">Conversation</label>
      <select id="conversations" aria-label="Conversation"></select>
      <button type="button" id="new-chat" class="quiet">New</button>
    </div>
    <main id="messages" role="log" aria-label="Conversation" aria-live="polite" aria-relevant="additions text"></main>
    <div id="notice" class="notice" role="status"></div>
    <div class="quick-chips" id="quick-chips" role="toolbar" aria-label="Quick actions">
      <button type="button" class="chip" data-chip="status">Status</button>
      <button type="button" class="chip" data-chip="round">Start round</button>
      <button type="button" class="chip" data-chip="council">Ask council</button>
      <button type="button" class="chip" data-chip="song">New song</button>
    </div>
    <form id="composer" class="composer">
      <label class="sr-only" for="message">Message Bob</label>
      <button type="button" id="mic" class="quiet icon-btn" aria-label="Voice input" title="Voice input">🎤</button>
      <textarea id="message" name="message" placeholder="Message Bob…" rows="1" maxlength="6000" required enterkeyhint="send"></textarea>
      <button type="button" id="speak" class="quiet icon-btn" aria-label="Read last reply aloud" title="Read aloud">🔊</button>
      <button type="button" id="stop" hidden>Stop</button>
      <button type="submit" id="send" class="primary">Send <span aria-hidden="true">↑</span></button>
    </form>
    <nav class="bottom-tabs" aria-label="Main">
      <button type="button" class="bottom-tab active" data-bottom="chat" aria-current="page">Chat</button>
      <button type="button" class="bottom-tab" data-bottom="ops">Jobs</button>
      <button type="button" class="bottom-tab" data-bottom="lanes">Models</button>
      <button type="button" class="bottom-tab" data-bottom="song">Songs</button>
      <button type="button" class="bottom-tab" data-bottom="settings">Settings</button>
    </nav>
  </div>

  <div id="sheet-backdrop" class="sheet-backdrop" hidden></div>
  <aside id="tools-sheet" class="tools-sheet" aria-hidden="true" aria-label="Ops and settings">
    <div class="sheet-grab" aria-hidden="true"></div>
    <nav class="sheet-tabs" aria-label="Sections">
      <button type="button" class="sheet-tab active" data-sheet="ops">Jobs</button>
      <button type="button" class="sheet-tab" data-sheet="conductor">Conductor</button>
      <button type="button" class="sheet-tab" data-sheet="song">Songs</button>
      <button type="button" class="sheet-tab" data-sheet="lanes">Models</button>
      <button type="button" class="sheet-tab" data-sheet="settings">Settings</button>
    </nav>
    <div class="sheet-panels">
      <section id="sheet-ops" class="sheet-panel active" data-panel="ops">
        <h2 class="sheet-title">What’s running</h2>
        <p id="status-summary" class="sheet-lead muted"></p>
        <div id="status-body" class="status-body"></div>
        <div id="live-jobs" class="live-jobs" aria-live="polite"></div>
      </section>
      <section id="sheet-conductor" class="sheet-panel" data-panel="conductor" hidden>
        <h2 class="sheet-title">Conductor</h2>
        <p id="conductor-summary" class="sheet-lead muted"></p>
        <div id="conductor-body" class="status-body"></div>
        <p class="sheet-hint muted">From chat: <code>run council on: …</code> then <code>yes, run council</code> · <code>start a job: …</code> then <code>yes, start job</code></p>
      </section>
      <section id="sheet-song" class="sheet-panel" data-panel="song" hidden>
        <h2 class="sheet-title">Song notebook</h2>
        <p id="song-summary" class="sheet-lead muted"></p>
        <div class="song-body">
          <label class="sr-only" for="song-title">Title</label>
          <input id="song-title" type="text" placeholder="Song title" maxlength="120">
          <label class="sr-only" for="song-lyrics">Lyrics</label>
          <textarea id="song-lyrics" placeholder="Lyrics / hooks" rows="4" maxlength="120000"></textarea>
          <textarea id="song-chords" placeholder="Chords / progression" rows="2" maxlength="120000"></textarea>
          <textarea id="song-notes" placeholder="Arrangement notes" rows="2" maxlength="120000"></textarea>
          <div class="song-actions">
            <button type="button" id="song-save">Save</button>
            <button type="button" id="song-demo">Local sketch ($0)</button>
            <label class="upload-label"><input id="song-upload" type="file" accept="audio/*"> Upload audio</label>
          </div>
          <audio id="song-player" controls hidden></audio>
          <p id="song-notice" class="muted"></p>
        </div>
      </section>
      <section id="sheet-lanes" class="sheet-panel" data-panel="lanes" hidden>
        <h2 class="sheet-title">Model health</h2>
        <p id="lanes-summary" class="sheet-lead muted"></p>
        <div id="lanes" aria-live="polite"></div>
      </section>
      <section id="sheet-settings" class="sheet-panel" data-panel="settings" hidden>
        <h2 class="sheet-title">Settings &amp; reports</h2>
        <div class="routing">
          <label for="provider-choice">Reply with</label>
          <select id="provider-choice">
            <option value="auto">Automatic · short: Gemini → MiniMax · long: Codex → Cursor</option>
            <option value="claude">Claude · short critique (explicit)</option>
          </select>
        </div>
        <div class="report-actions">
          <button type="button" data-report="status">Ops status</button>
          <button type="button" data-report="review">Latest review</button>
          <button type="button" data-report="jobs">Running jobs</button>
        </div>
        <p class="sheet-hint muted">Drafts stay drafts. Confirm before merge, send, or spend.</p>
      </section>
    </div>
    <button type="button" id="close-sheet" class="sheet-close quiet">Done</button>
  </aside>

  <dialog id="report">
    <div class="report-heading"><h2 id="report-title"></h2><button type="button" id="close-report" aria-label="Close report">Close</button></div>
    <p id="report-date" class="muted"></p>
    <pre id="report-body"></pre>
  </dialog>
</body>
</html>
