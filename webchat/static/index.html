<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Bob">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="/manifest.webmanifest">
  <title>Bob · Chat</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <div class="app">
    <header>
      <div class="identity"><span class="avatar" aria-hidden="true">b</span><div><h1>Bob</h1><p id="connection">Your chat on the mini</p></div></div>
      <button id="logout" class="quiet">Log out</button>
    </header>
    <div class="handback-chip" id="handback-chip" role="status" aria-live="polite"></div>
    <details id="status-panel" open>
      <summary>Live ops <span id="status-summary" class="muted"></span></summary>
      <div id="status-body" class="status-body"></div>
      <div id="live-jobs" class="live-jobs" aria-live="polite"></div>
    </details>
    <details id="conductor-panel">
      <summary>Conductor <span id="conductor-summary" class="muted"></span></summary>
      <div id="conductor-body" class="status-body"></div>
    </details>
    <details id="song-panel">
      <summary>Song project <span id="song-summary" class="muted"></span></summary>
      <div class="song-body">
        <label class="sr-only" for="song-title">Title</label>
        <input id="song-title" type="text" placeholder="Song title" maxlength="120">
        <label class="sr-only" for="song-lyrics">Lyrics</label>
        <textarea id="song-lyrics" placeholder="Lyrics / hooks" rows="4" maxlength="120000"></textarea>
        <textarea id="song-chords" placeholder="Chords / progression" rows="2" maxlength="120000"></textarea>
        <textarea id="song-notes" placeholder="Arrangement notes" rows="2" maxlength="120000"></textarea>
        <div class="song-actions">
          <button id="song-save" type="button">Save notebook</button>
          <button id="song-demo" type="button">Local sketch demo ($0)</button>
          <label class="upload-label"><input id="song-upload" type="file" accept="audio/*"> Upload audio</label>
        </div>
        <audio id="song-player" controls hidden></audio>
        <p id="song-notice" class="muted"></p>
      </div>
    </details>
    <nav aria-label="Bob reports">
      <button data-report="status">STATUS.md</button>
      <button data-report="review">Latest review</button>
      <button data-report="jobs">Jobs detail</button>
    </nav>
    <details id="lanes-panel"><summary>Model lanes <span id="lanes-summary"></span></summary><div id="lanes" aria-live="polite"></div></details>
    <div class="conversation-bar">
      <label class="sr-only" for="conversations">Conversation</label>
      <select id="conversations" aria-label="Conversation"></select>
      <button id="new-chat" class="quiet">+ New chat</button>
    </div>
    <main id="messages" role="log" aria-label="Conversation" aria-live="polite" aria-relevant="additions text"></main>
    <div id="notice" class="notice" role="status"></div>
    <div class="routing"><label for="provider-choice">Reply with</label><select id="provider-choice"><option value="auto">Automatic · short: Gemini → MiniMax · long: Codex → Cursor</option><option value="claude">Claude · short critique (explicit choice)</option></select></div>
    <form id="composer" class="composer">
      <label class="sr-only" for="message">Message Bob</label>
      <button id="mic" type="button" class="quiet" aria-label="Voice input" title="Voice input">🎤</button>
      <textarea id="message" name="message" placeholder="Message Bob…" rows="1" maxlength="6000" required></textarea>
      <button id="speak" type="button" class="quiet" aria-label="Read last reply aloud" title="Read aloud">🔊</button>
      <button id="stop" type="button" hidden>Stop</button>
      <button id="send" type="submit" class="primary">Send <span aria-hidden="true">↑</span></button>
    </form>
    <footer>Drafts stay drafts. You decide what gets sent. On iPhone, tap 🎤 for voice or use the keyboard mic for dictation.</footer>
  </div>
  <dialog id="report">
    <div class="report-heading"><h2 id="report-title"></h2><button id="close-report" aria-label="Close report">Close</button></div>
    <p id="report-date" class="muted"></p>
    <pre id="report-body"></pre>
  </dialog>
</body>
</html>
