<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Log in · Bob</title>
  <link rel="stylesheet" href="/style.css?v=__WEBBOB_SHA__">
  <script src="/app.js" defer></script>
</head>
<body class="login-page">
  <main class="login-card">
    <span class="avatar large" aria-hidden="true">b</span>
    <p class="eyebrow">YOUR MINI. YOUR BOB.</p>
    <h1>Hey, Jeff.</h1>
    <p class="muted">A place to pick up the conversation.</p>
    <form id="login-form" method="post" action="/login">
      <label for="password">Bob password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
      <p id="login-error" class="notice" role="alert"></p>
      <button type="submit" class="primary">Open chat <span aria-hidden="true">→</span></button>
    </form>
    <p class="login-help">Use the password Bob saved on this mini.<br><code>conductor/webchat/.password</code></p>
  </main>
</body>
</html>
